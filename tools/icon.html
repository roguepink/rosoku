<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<canvas id="c"></canvas>
<script>
// アイコン: ほぼ墨色。下のほうに小さな炎、その下に細い横線(台のふち)、線の下にぼんやり映り込み。
const q = new URLSearchParams(location.search);
const S = +(q.get('s') || 512), pad = +(q.get('pad') || 0);
const c = document.getElementById('c'); c.width = c.height = S;
const g = c.getContext('2d');
g.fillStyle = '#0b0907'; g.fillRect(0, 0, S, S);
const k = (S - pad * 2) / 512, ox = pad, oy = pad;
const X = (v) => ox + v * k, Y = (v) => oy + v * k;
const fx = 256, fy = 300, fh = 175, fw = 24;
// ぼんやりした光
let r = g.createRadialGradient(X(fx), Y(fy - 50), 0, X(fx), Y(fy - 50), 230 * k);
r.addColorStop(0, 'rgba(232,140,60,0.30)'); r.addColorStop(0.35, 'rgba(180,90,40,0.10)'); r.addColorStop(1, 'rgba(0,0,0,0)');
g.fillStyle = r; g.fillRect(0, 0, S, S);
function flame(cx, base, h, w, alpha, flip) {
  g.save(); g.globalAlpha = alpha;
  if (flip) { g.translate(0, Y(base) * 2); g.scale(1, -1); }
  g.beginPath();
  g.moveTo(X(cx), Y(base - h));
  g.bezierCurveTo(X(cx + w * 0.35), Y(base - h * 0.62), X(cx + w), Y(base - h * 0.28), X(cx + w * 0.82), Y(base - h * 0.08));
  g.bezierCurveTo(X(cx + w * 0.6), Y(base + 6), X(cx - w * 0.6), Y(base + 6), X(cx - w * 0.82), Y(base - h * 0.08));
  g.bezierCurveTo(X(cx - w), Y(base - h * 0.28), X(cx - w * 0.35), Y(base - h * 0.62), X(cx), Y(base - h));
  const lg = g.createLinearGradient(0, Y(base - h), 0, Y(base));
  lg.addColorStop(0, 'rgba(232,110,40,0.85)'); lg.addColorStop(0.3, '#ffc46b'); lg.addColorStop(0.62, '#fff4d6'); lg.addColorStop(0.9, '#ffd89a'); lg.addColorStop(1, 'rgba(120,120,255,0.4)');
  g.fillStyle = lg; g.shadowColor = 'rgba(255,170,80,0.8)'; g.shadowBlur = 30 * k; g.fill();
  g.restore();
}
flame(fx, fy, fh, fw, 1, false);
// 芯
g.strokeStyle = '#1a120c'; g.lineWidth = 4 * k; g.beginPath(); g.moveTo(X(fx), Y(fy + 2)); g.quadraticCurveTo(X(fx + 2), Y(fy - 20), X(fx + 5), Y(fy - 30)); g.stroke();
// 台のふち
g.fillStyle = 'rgba(201,184,154,0.35)'; g.fillRect(X(150), Y(fy + 26), 212 * k, Math.max(1, 2 * k));
// 映り込み
g.save(); g.filter = `blur(${10 * k}px)`; flame(fx, fy + 52, fh * 0.75, fw * 0.9, 0.28, true); g.restore();
</script>
