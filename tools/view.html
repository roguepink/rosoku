<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000}canvas{width:100vw;height:100vh;display:block}</style>
<canvas id="c"></canvas>
<script type="module">
import { Scene } from '../js/scene.js';
const q = new URLSearchParams(location.search);
const s = new Scene(document.getElementById('c'));
s.set({ candle: +(q.get('c')||0), size: +(q.get('size')||1), sway: +(q.get('sway')||1), bright: +(q.get('b')||2), warm: +(q.get('w')||1) });
s.lit = 1; s.litTarget = 1; s.fade = 0; s.fadeTarget = 0;
if (q.get('out')) setTimeout(()=>s.extinguish(), +q.get('out')*1000);
window.__s = s; s.start();
</script>
